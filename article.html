    <script src="data.js"></script>
    <script>
        function getQueryParam(name) { return new URLSearchParams(window.location.search).get(name); }
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            const slug = getQueryParam('slug');
            if (!slug) { window.location.href = 'articles.html'; return; }
            const article = ARTICLES.find(a => a.slug === slug);
            if (!article) { window.location.href = 'articles.html'; return; }

            document.getElementById('article-title').textContent = `${article.title} | Fidox Intelligence`;
            document.getElementById('meta-description').content = article.excerpt;
            document.getElementById('canonical').href = `https://fidox-intelligence.pages.dev/article.html?slug=${article.slug}`;
            document.getElementById('og-title').content = article.title;
            document.getElementById('og-description').content = article.excerpt;
            document.getElementById('og-url').content = `https://fidox-intelligence.pages.dev/article.html?slug=${article.slug}`;
            document.getElementById('schema-data').textContent = JSON.stringify({
                "@context":"https://schema.org","@type":"Article",
                "headline":article.title,"description":article.excerpt,
                "author":{"@type":"Organization","name":"Fidox Intelligence"},
                "datePublished":article.date,"dateModified":article.date,
                "url":`https://fidox-intelligence.pages.dev/article.html?slug=${article.slug}`
            });

            document.getElementById('a-title').textContent = article.title;
            document.getElementById('a-category').textContent = article.category;
            document.getElementById('a-cat-breadcrumb').textContent = article.category;
            document.getElementById('a-author').textContent = article.author;
            document.getElementById('a-date').textContent = formatDate(article.date);
            document.getElementById('a-readtime').textContent = article.readTime + ' de lecture';
            document.getElementById('a-body').innerHTML = `
                <div class="article-hero-image" style="background-image:url('${article.image}')"></div>
                <p class="lead">${article.excerpt}</p>
                <h2>Pourquoi ce modèle mérite l'attention</h2>
                <p>Cet article présente une analyse détaillée des performances du modèle sur les benchmarks les plus reconnus de l'industrie : LMSYS Arena (votes humains), MMLU (connaissances générales), GPQA (raisonnement scientifique de niveau doctorat), et HumanEval (capacités en génération de code).</p>
                <h2>Benchmarks clés</h2>
                <p>Les scores présentés proviennent de sources publiques et sont mis à jour régulièrement. Le classement LMSYS Arena repose sur plus de 6 millions de votes humains en comparaisons aveugles, ce qui en fait la référence la plus fiable pour évaluer la qualité perçue des modèles.</p>
                <h2>Comparaison avec les concurrents</h2>
                <p>En comparaison avec les autres modèles de la même catégorie, ce modèle se distingue par ses performances exceptionnelles en génération de code et en raisonnement complexe. Les détails complets sont disponibles sur la <a href="models.html">page des modèles</a>.</p>
            `;
        });
    </script>
