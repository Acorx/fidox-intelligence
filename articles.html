<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles & Analyses IA - Blog Fidox Intelligence</title>
    <meta name="description" content="Analyses approfondies des modèles IA : Claude Fable 5, Kimi K3, GPT-5.6 Sol. Benchmarks, comparatifs et guides pratiques.">
    <meta name="keywords" content="articles IA, analyse modèles, benchmark, Claude, GPT, Kimi, guide IA 2026">
    <meta name="author" content="Fidox Intelligence">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://fidox-intelligence.pages.dev/articles.html">
    <meta property="og:title" content="Articles - Fidox Intelligence">
    <meta property="og:description" content="Analyses et benchmarks des meilleurs modèles IA.">
    <meta property="og:url" content="https://fidox-intelligence.pages.dev/articles.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fidox-intelligence.pages.dev/logo-fidox.png">
    <link rel="icon" type="image/png" href="logo-fidox.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Blog Fidox Intelligence",
        "description": "Analyses et benchmarks des modèles d'intelligence artificielle",
        "url": "https://fidox-intelligence.pages.dev/articles.html",
        "author": { "@type": "Organization", "name": "Fidox Intelligence" }
    }
    </script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="logo-fidox.png" alt="Fidox Intelligence" class="logo-img">
                <span>Fidox Intelligence</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="models.html" class="nav-link">Modèles</a>
                <a href="leaderboard.html" class="nav-link">Leaderboard</a>
                <a href="articles.html" class="nav-link active">Articles</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer le thème">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <nav aria-label="Fil d'Ariane" class="breadcrumb">
                    <a href="index.html">Accueil</a> <span>›</span> <span>Articles</span>
                </nav>
                <h1>Articles & Analyses</h1>
                <p>Benchmarks approfondis, comparatifs et guides pratiques sur les modèles IA</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="articles-grid" id="articles-grid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 Fidox Intelligence. Analyses basées sur des données publiques.</p>
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.getElementById('articles-grid').innerHTML = ARTICLES.map(a => `
                <article class="article-card">
                    <div class="article-card-image" style="background-image:url('${a.image}')"></div>
                    <div class="article-card-content">
                        <div class="article-card-meta">
                            <span class="article-category">${a.category}</span>
                            <span class="article-date">${formatDate(a.date)}</span>
                            <span class="article-read-time">${a.readTime}</span>
                        </div>
                        <h3><a href="article.html?slug=${a.slug}" style="color:inherit;text-decoration:none;">${a.title}</a></h3>
                        <p>${a.excerpt}</p>
                        <a href="article.html?slug=${a.slug}" class="btn btn-text">Lire l'article →</a>
                    </div>
                </article>
            `).join('');
        });
    </script>
</body>
</html>
