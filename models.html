<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les Modèles IA - Classement Benchmarks 2026 | Fidox Intelligence</title>
    <meta name="description" content="Catalogue complet de 27 modèles IA : Claude Fable 5, GPT-5.6 Sol, Kimi K3, GLM-5.2, Grok 4.6 et plus. Benchmarks MMLU, GPQA, HumanEval, LMSYS Arena.">
    <meta name="keywords" content="modèles IA, classement LLM, benchmarks, Claude, GPT, Kimi, GLM, Grok, Qwen, comparaison, intelligence artificielle">
    <meta name="author" content="Fidox Intelligence">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://fidox-intelligence.pages.dev/models.html">
    <meta property="og:title" content="Tous les Modèles IA - Fidox Intelligence">
    <meta property="og:description" content="27 modèles IA comparés avec benchmarks réels.">
    <meta property="og:url" content="https://fidox-intelligence.pages.dev/models.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fidox-intelligence.pages.dev/logo-fidox.png">
    <link rel="icon" type="image/png" href="logo-fidox.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Catalogue des Modèles IA",
        "description": "27 modèles d'intelligence artificielle classés par performance",
        "url": "https://fidox-intelligence.pages.dev/models.html"
    }
    </script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="logo-fidox.png" alt="Fidox Intelligence" class="logo-img">
                <span>Fidox Intelligence</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="models.html" class="nav-link active">Modèles</a>
                <a href="leaderboard.html" class="nav-link">Leaderboard</a>
                <a href="articles.html" class="nav-link">Articles</a>
            </nav>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer le thème">
                <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main>
        <section class="page-hero">
            <div class="container">
                <nav aria-label="Fil d'Ariane" class="breadcrumb">
                    <a href="index.html">Accueil</a> <span>›</span> <span>Modèles</span>
                </nav>
                <h1>Tous les modèles IA</h1>
                <p>27 modèles classés par performance globale — MMLU, GPQA, HumanEval, LMSYS Arena</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <!-- Filters -->
                <div class="filters">
                    <input type="text" id="search-input" class="search-input" placeholder="Rechercher un modèle..." oninput="filterModels()">
                    <div class="filter-tags">
                        <button class="filter-btn active" onclick="setFilter('all')">Tous</button>
                        <button class="filter-btn" onclick="setFilter('Frontier')">Frontier</button>
                        <button class="filter-btn" onclick="setFilter('High-End')">High-End</button>
                        <button class="filter-btn" onclick="setFilter('Open')">Open Source</button>
                        <button class="filter-btn" onclick="setFilter('Value')">Bon prix</button>
                        <button class="filter-btn" onclick="setFilter('Emerging')">Émergents</button>
                    </div>
                </div>
                <!-- Results count -->
                <p class="results-count" id="results-count"></p>
                <!-- Model grid -->
                <div class="models-grid" id="models-grid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 Fidox Intelligence. Données issues de LMSYS Arena, Artificial Analysis, BenchLM.</p>
            </div>
        </div>
    </footer>

    <script src="data.js"></script>
    <script>
        function filterModels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.querySelector('.filter-btn.active')?.dataset.cat || 'all';
            renderAllModels(query, category);
        }
        function setFilter(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            event.target.dataset.cat = cat;
            filterModels();
        }
        function renderAllModels(search = '', category = 'all') {
            let filtered = MODELS;
            if (search) filtered = filtered.filter(m => m.name.toLowerCase().includes(search) || m.developer.toLowerCase().includes(search));
            if (category !== 'all') filtered = filtered.filter(m => m.category === category);
            document.getElementById('results-count').textContent = `${filtered.length} modèle${filtered.length > 1 ? 's' : ''}`;
            document.getElementById('models-grid').innerHTML = filtered.map(model => `
                <a href="model.html?slug=${model.slug}" class="model-card">
                    <div class="model-card-header">
                        <div class="model-logo ${getModelLogoClass(model.developer)}">${model.name[0]}</div>
                        <div class="model-card-info">
                            <h3>${model.name}</h3>
                            <span class="model-provider">${model.developer}</span>
                        </div>
                        <div class="model-score ${getScoreClass(model.globalScore)}">${model.globalScore}</div>
                    </div>
                    <div class="model-card-meta">
                        <span>${model.params}</span>
                        <span>${model.contextWindow}</span>
                        <span>${model.releaseYear}</span>
                    </div>
                    <p class="model-card-desc">${model.description}</p>
                    <div class="model-card-tags">
                        ${model.openSource ? '<span class="tag tag-open">Open</span>' : ''}
                        <span class="tag">${model.category}</span>
                    </div>
                </a>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', () => { renderAllModels(); initTheme(); });
    </script>
</body>
</html>
